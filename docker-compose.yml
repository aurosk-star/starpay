services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-gateway-api
    env_file:
      - .env
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-payment_gateway}
      DB_USER: ${POSTGRES_USER:-payment}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payment}
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      ORDER_EXPIRE_WORKER_CONCURRENCY: ${ORDER_EXPIRE_WORKER_CONCURRENCY:-2}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: payment-gateway-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-payment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payment}
    ports:
      - "${POSTGRES_PORT:-15434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: payment-gateway-redis
    ports:
      - "${REDIS_PORT:-16380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
