name: 功能建议
description: 提议一个明确的使用场景或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述业务问题，不要在公开 Issue 中包含真实凭据、支付数据或个人数据。
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 谁会在什么情况下遇到什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、接口或交互。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明已经考虑过的替代方案和权衡。
    validations:
      required: true
